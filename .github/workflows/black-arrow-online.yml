name: Black Arrow Online release

# Builds xemu.exe and the launcher, and the Mac app, and publishes them as a
# release that the launcher and the Mac app offer to players as an update.
#
# A release is made when the main branch changes, from main exactly as it is.
# A new xemu release is never merged into a release here: the daily check
# merges it into a copy of main, builds that, and keeps it as a draft release
# (only people who can push to this repository see drafts; players never get
# them), with the xemu changes it brings in the draft's notes and an issue
# pointing to it. When it does not merge cleanly the issue says so and nothing
# is built. Taking the xemu release into a real build is a merge done by hand
# and pushed to main.
#
# A push whose shader state headers no longer match .github/shader-state.txt
# releases nothing (see that file): the shader lists would stop loading.
#
# The Windows files are published as soon as they are built. The Mac and
# Linux apps take longer; their files are added to the same release when
# each is done, and a failed Mac or Linux build leaves the release without
# it. The systems' files never share a name: launchers read version.txt and
# BlackArrowOnline-update.zip, the Mac app mac-version.txt and
# BlackArrowOnline-mac-update.zip, the Linux app linux-version.txt and
# BlackArrowOnline-linux-update.tar.gz.
#
# A push to mac-build or linux-build runs everything without publishing: the
# would-be release files are kept as downloads on the run's page (Artifacts).
#
# Sub builds: a head commit whose message has a line "Release-Sub: mac" (or
# "mac linux", "windows"...) makes a sub build of the newest release, such as
# 26.1 after 26, that builds only those systems. Its version files say
# build=26 and sub=1 (launchers and apps before 26 read build=26 only), its
# tag is build-26.1, and it is marked latest, so it carries every system's
# files: the systems it leaves out get the newest release's files, copied
# unchanged, and see nothing new. Its notes say which systems it is for in a
# "<!-- systems: mac -->" line, which the Versions window reads. The next push
# without that line makes the next whole build (27).

on:
  push:
    branches: [main, mac-build, linux-build]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'black-arrow-online/docs/**'
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Release even when nothing changed
        type: boolean
        default: false
      xemu_test:
        description: Make the draft test build for the latest xemu release now
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: black-arrow-online-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check for changes and package the source
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      publish: ${{ steps.plan.outputs.publish }}
      draft: ${{ steps.plan.outputs.draft }}
      build: ${{ steps.plan.outputs.build }}
      sub: ${{ steps.plan.outputs.sub }}
      label: ${{ steps.plan.outputs.label }}
      systems: ${{ steps.plan.outputs.systems }}
      prev_tag: ${{ steps.plan.outputs.prev_tag }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.merge.outputs.version }}
      upstream: ${{ steps.merge.outputs.upstream }}
      commit: ${{ steps.merge.outputs.commit }}
      image: ${{ steps.merge.outputs.image }}
    env:
      GH_TOKEN: ${{ github.token }}
      # Not the upstream remote, which gh would prefer
      GH_REPO: ${{ github.repository }}
    steps:
    - name: Clone tree
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        fetch-depth: 0
    - name: Merge the latest xemu release (draft test builds only)
      id: merge
      env:
        XEMU_TEST: ${{ github.event_name == 'schedule' || inputs.xemu_test == true }}
        FORCE: ${{ inputs.force }}
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Files this repository replaces keep its version
        git config merge.ours.driver true
        printf '%s merge=ours\n' README.md .github/workflows/ci.yml \
            .github/workflows/bump-subproject-wraps.yml >> .git/info/attributes

        git remote add upstream https://github.com/xemu-project/xemu.git
        git fetch --quiet --tags upstream master
        commit=$(git rev-parse HEAD)
        # The xemu release main is based on
        based=$(git describe --tags --abbrev=0 --match 'v*' HEAD)
        upstream=$based
        mode=release
        mkdir -p meta

        if [ "$XEMU_TEST" = true ]; then
          latest=$(gh api repos/xemu-project/xemu/releases/latest --jq .tag_name)
          mode=none
          if git merge-base --is-ancestor "$latest" HEAD; then
            echo "Main already has xemu $latest."
          elif gh release view "xemu-$latest-test" >/dev/null 2>&1 && [ "$FORCE" != true ]; then
            echo "The draft test build for xemu $latest is already made."
          else
            mode=draft
            upstream=$latest
            # What the draft's notes and issue say about this xemu release
            mb=$(git merge-base HEAD "$latest")
            theirs=$(git diff --name-only "$mb" "$latest")
            ours=$(git diff --name-only "$mb" HEAD)
            {
              echo "Main ($(git rev-parse --short HEAD), xemu ${based#v}) with xemu ${latest#v} merged in. Not released to players."
              echo
              echo "Release notes: https://github.com/xemu-project/xemu/releases/tag/$latest"
              echo
              if echo "$theirs" | grep -q -x -e 'hw/xbox/nv2a/pgraph/glsl/shaders.h' \
                  -e 'hw/xbox/nv2a/pgraph/glsl/vsh.h' -e 'hw/xbox/nv2a/pgraph/glsl/psh.h'; then
                echo "**Shader state changed** (shaders.h, vsh.h or psh.h): check that shader-list.bin still loads (\"does not match this emulator\" in xemu.log means precache is off)."
                echo
              fi
              echo "### Files both xemu and Black Arrow Online changed"
              echo
              echo '```'
              comm -12 <(echo "$theirs" | sort) <(echo "$ours" | sort) || true
              echo '```'
              echo
              echo "### xemu changes not in main yet"
              echo
              git log --no-merges --format='- %s (%h)' "HEAD..$latest" | head -n 200 || true
            } > meta/xemu.md
            echo "Merging xemu $latest"
            if ! git merge --no-edit "$latest"; then
              files=$(git diff --name-only --diff-filter=U)
              title="Update to xemu $latest needs a manual merge"
              open=$(gh issue list --state open --search "\"$title\" in:title" \
                     --json number --jq 'length')
              if [ "$open" = "0" ]; then
                gh issue create --title "$title" --body "xemu $latest does not merge cleanly into main, so no test build was made. Nothing was released.

        Files with conflicts:

        \`\`\`
        $files
        \`\`\`

        $(cat meta/xemu.md)"
              fi
              exit 1
            fi
          fi
        fi

        version=$(git describe --tags --match 'v*' | cut -c 2-)
        # The toolchain image the xemu Windows build uses
        tag=$({ grep -o -e '-gcc:sha-[0-9a-f]*' .github/workflows/build-windows.yml || true; } |
              head -n 1)
        image="xemu-win64-toolchain${tag:--gcc:sha-2881edd}"
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "image=ghcr.io/xemu-project/$image" >> "$GITHUB_OUTPUT"
    # Drafts are allowed through: their notes warn about this instead
    - name: Check the shader list format
      if: steps.merge.outputs.mode == 'release'
      run: |
        set -euo pipefail
        files="hw/xbox/nv2a/pgraph/glsl/shaders.h hw/xbox/nv2a/pgraph/glsl/vsh.h
               hw/xbox/nv2a/pgraph/glsl/geom.h hw/xbox/nv2a/pgraph/glsl/psh.h
               hw/xbox/nv2a/pgraph/vsh_regs.h hw/xbox/nv2a/pgraph/psh_regs.h"
        want=$(grep -v -e '^#' -e '^[[:space:]]*$' .github/shader-state.txt | head -n 1 | tr -d '[:space:]')
        got=$(for f in $files; do git show "HEAD:$f"; done | sha256sum | cut -d' ' -f1)
        if [ "$want" != "$got" ]; then
          echo "::error title=Shader state changed, nothing released::The ShaderState headers changed, so xemu would reject shader-list.bin and players' learned shader lists and precache would turn off. Ship a converter for both lists in this build if the layout changed, then put this line in .github/shader-state.txt: $got"
          exit 1
        fi
        echo "Shader state headers unchanged ($got)."
    - name: Compare with the latest release
      id: plan
      env:
        MODE: ${{ steps.merge.outputs.mode }}
        UPSTREAM: ${{ steps.merge.outputs.upstream }}
        COMMIT: ${{ steps.merge.outputs.commit }}
        FORCE: ${{ inputs.force }}
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        mkdir -p prev meta
        {
          echo "sub=0"
          echo "systems=windows mac linux"
        } >> "$GITHUB_OUTPUT"
        if [ "$MODE" = none ]; then
          echo "release=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$MODE" = draft ]; then
          # No build number: a launcher given this build by hand still takes
          # the next real build
          cp meta/xemu.md meta/changes.md
          echo "Test build with xemu ${UPSTREAM#v}, not released" > meta/notes.txt
          {
            echo "release=true"
            echo "publish=false"
            echo "draft=true"
            echo "build="
            echo "label="
            echo "tag=xemu-$UPSTREAM-test"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "draft=false" >> "$GITHUB_OUTPUT"
        # The newest release; its tag numbers this one (build-26, build-26.1)
        prev_tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
        gh release download ${prev_tag:+"$prev_tag"} --pattern version.txt --dir prev 2>/dev/null || true
        field() {
          { grep -m 1 "^$1=" prev/version.txt 2>/dev/null || true; } | cut -d= -f2- | tr -d '\r'
        }
        prev_build=$(field build)
        prev_commit=$(field commit)
        prev_upstream=$(field upstream)
        prev_sub=0
        # A sub build's version.txt may be the build before it, copied: its
        # number and commit come from the tag
        case "$prev_tag" in
          build-*.*)
            prev_build=${prev_tag#build-}
            prev_sub=${prev_build#*.}
            prev_build=${prev_build%%.*}
            prev_commit=$(git rev-list -n 1 "$prev_tag" 2>/dev/null || echo "$prev_commit")
            ;;
        esac
        echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"

        # "Release-Sub: mac linux" in the head commit's message: a sub build
        # for those systems
        systems=$(git log -1 --format=%B "$COMMIT" |
                  sed -n 's/^Release-Sub:[[:space:]]*//Ip' | head -n 1 |
                  tr 'A-Z,' 'a-z ' | xargs || true)
        for s in $systems; do
          case "$s" in
            windows|mac|linux) ;;
            *) echo "::error title=Unknown system in Release-Sub::$s (use windows, mac or linux)"
               exit 1 ;;
          esac
        done
        if [ -n "$systems" ] && [ -z "$prev_build" ]; then
          echo "::error title=No build to make a sub build of::Release-Sub needs a published build first"
          exit 1
        fi

        if [ "$prev_commit" = "$COMMIT" ] && [ "$prev_upstream" = "$UPSTREAM" ] &&
           [ "$FORCE" != "true" ]; then
          echo "Build $prev_build is current."
          echo "release=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        : > meta/changes.md
        if [ -z "$prev_build" ]; then
          echo "- First build published from this repository" >> meta/changes.md
        fi
        # Only a newer xemu: build 16 was made with v0.8.137 merged at build
        # time, while main itself was still on v0.8.136
        if [ -n "$prev_upstream" ] && [ "$prev_upstream" != "$UPSTREAM" ] &&
           [ "$(printf '%s\n' "$prev_upstream" "$UPSTREAM" | sort -V | tail -n 1)" = "$UPSTREAM" ]; then
          echo "- Updated to xemu release $UPSTREAM" >> meta/changes.md
        fi
        if [ -n "$prev_commit" ] && git cat-file -e "$prev_commit^{commit}" 2>/dev/null; then
          # Only player-facing lines: subjects that start with a lowercase
          # code area ("ci:", "nv2a:", "i386/tcg:", "make-package.py:") are
          # for developers. "Mac:" lines stay.
          git log --no-merges --first-parent --format='- %s' "$prev_commit..$COMMIT" |
              { grep -Ev '^- [a-z0-9][A-Za-z0-9/._-]*: ' || true; } | head -n 20 >> meta/changes.md
        fi
        head -n 1 meta/changes.md | cut -c 3- > meta/notes.txt

        echo "release=true" >> "$GITHUB_OUTPUT"
        if [ -n "$systems" ]; then
          build=$prev_build
          sub=$(( prev_sub + 1 ))
          label="$build.$sub"
          echo "Sub build $label for: $systems (the rest copied from $prev_tag)"
        else
          build=$(( ${prev_build:-0} + 1 ))
          sub=0
          label=$build
          systems="windows mac linux"
        fi
        {
          echo "build=$build"
          echo "sub=$sub"
          echo "label=$label"
          echo "systems=$systems"
          echo "tag=build-$label"
        } >> "$GITHUB_OUTPUT"
        # Only main publishes; other branches are test runs
        if [ "$GITHUB_REF" = refs/heads/main ]; then
          echo "publish=true" >> "$GITHUB_OUTPUT"
        else
          echo "publish=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Install dependencies
      if: steps.plan.outputs.release == 'true'
      run: sudo apt-get install meson
    - name: Create source package
      if: steps.plan.outputs.release == 'true'
      env:
        VERSION: ${{ steps.merge.outputs.version }}
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        pkg_name="xemu-${VERSION}"
        ./scripts/archive-source.sh "${pkg_name}.tar" "./${pkg_name}/"
        git rev-parse HEAD | tr -d '\n' > XEMU_COMMIT
        echo -n "${VERSION}" > XEMU_VERSION
        tar -r --file "${pkg_name}.tar" --transform "s,^./,./${pkg_name}/," ./XEMU_COMMIT ./XEMU_VERSION
        zstd "${pkg_name}.tar"
    - name: Upload source package
      if: steps.plan.outputs.release == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: src
        path: xemu-${{ steps.merge.outputs.version }}.tar.zst
        compression-level: 0
    - name: Upload release notes
      if: steps.plan.outputs.release == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: meta
        path: meta

  build:
    name: Build xemu.exe
    needs: prepare
    if: needs.prepare.outputs.release == 'true' && contains(needs.prepare.outputs.systems, 'windows')
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare.outputs.image }}
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: /tmp/xemu-ccache
      CCACHE_MAXSIZE: 512M
      LTO_CACHE_DIR: /tmp/xemu-lto-ccache
      CROSSPREFIX: x86_64-w64-mingw32.static-
      CROSSAR: x86_64-w64-mingw32.static-gcc-ar
    steps:
    - name: Download source package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
      with:
        name: src
    - name: Install curl
      run: |
        apt-get update
        apt-get install -qy curl zstd
    - name: Extract source package
      run: tar -xf xemu-${{ needs.prepare.outputs.version }}.tar.zst --strip-components=2
    - name: Initialize compiler cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
      with:
        path: |
          ${{ env.CCACHE_DIR }}
          ${{ env.LTO_CACHE_DIR }}
        key: cache-bao-wincross-${{ github.sha }}-${{ github.run_id }}
        restore-keys: cache-bao-wincross-
    - name: Compile
      run: |
        mkdir -p "${CCACHE_DIR}" "${LTO_CACHE_DIR}"
        ./build.sh -p win64-cross \
            --extra-cflags="-flto-incremental=${LTO_CACHE_DIR} -flto-partition=cache" \
            -Db_lto=true \
            -Dx86_version=3 \
            --enable-whpx
    - name: Upload build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: xemu
        path: dist

  release:
    name: Package and release
    needs: [prepare, build]
    # Also when a sub build leaves Windows out (no xemu.exe built)
    if: always() && needs.prepare.outputs.release == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Not the upstream remote, which gh would prefer
      GH_REPO: ${{ github.repository }}
      BUILD: ${{ needs.prepare.outputs.build }}
      SUB: ${{ needs.prepare.outputs.sub }}
      LABEL: ${{ needs.prepare.outputs.label }}
      SYSTEMS: ${{ needs.prepare.outputs.systems }}
      PREV_TAG: ${{ needs.prepare.outputs.prev_tag }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      UPSTREAM: ${{ needs.prepare.outputs.upstream }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
    - name: Clone the launcher and package files
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        ref: ${{ needs.prepare.outputs.commit }}
        sparse-checkout: |
          black-arrow-online
          ui/icons
    - name: Download xemu.exe
      if: contains(needs.prepare.outputs.systems, 'windows')
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
      with:
        name: xemu
        path: pkg/system
    - name: Download source package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
      with:
        name: src
        path: src
    - name: Download release notes
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
      with:
        name: meta
        path: meta
    - name: Build the launcher
      if: contains(needs.prepare.outputs.systems, 'windows')
      shell: pwsh
      run: |
        & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ `
            "/win32icon:ui\icons\xemu-icon.ico" "/out:pkg\Black Arrow Online.exe" `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll `
            /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll `
            black-arrow-online\package\Launcher.cs
        if ($LASTEXITCODE) { exit 1 }
    - name: Package
      if: contains(needs.prepare.outputs.systems, 'windows')
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        cp black-arrow-online/package/README.txt pkg/README.txt
        cp "black-arrow-online/package/Start over.bat" "pkg/system/Start over.bat"
        cp black-arrow-online/package/Launcher.cs pkg/system/Launcher-source.cs
        cp black-arrow-online/package/shader-list.bin pkg/system/shader-list.bin
        notes=$(cat meta/notes.txt 2>/dev/null || true)
        printf 'build=%s\nxemu=%s\nversion=%s\ndate=%s\ncommit=%s\nupstream=%s\nnotes=%s\n' \
            "$BUILD" "${UPSTREAM#v}" "$VERSION" "$(date -u +%Y-%m-%d)" "$COMMIT" "$UPSTREAM" "$notes" \
            > pkg/system/version.txt
        if [ "${SUB:-0}" != 0 ]; then
          echo "sub=$SUB" >> pkg/system/version.txt
        fi
        (cd pkg && 7z a -tzip -bso0 ../BlackArrowOnline-update.zip .)
        cp pkg/system/version.txt version.txt
        echo "sha256=$(sha256sum BlackArrowOnline-update.zip | cut -d' ' -f1)" >> version.txt
        mv src/*.tar.zst "BlackArrowOnline-source-$TAG.tar.zst"
        cat version.txt
    # A sub build without Windows: the newest release's Windows files, so
    # Windows players see no new build
    - name: Copy the Windows files of the build before
      if: "!contains(needs.prepare.outputs.systems, 'windows')"
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        gh release download "$PREV_TAG" --pattern version.txt --pattern BlackArrowOnline-update.zip
        mv src/*.tar.zst "BlackArrowOnline-source-$TAG.tar.zst"
        cat version.txt
    - name: Write the draft's notes
      if: needs.prepare.outputs.draft == 'true'
      shell: bash
      run: |
        {
          echo "**Draft test build, not released.** Players never see drafts. To test it, unzip \`BlackArrowOnline-update.zip\` over a copy of a Black Arrow Online folder; it has no build number, so that copy's launcher still offers the next real build."
          echo
          echo "To take this xemu release, merge it by hand, test, and push to main; delete this draft afterwards."
          echo
          cat meta/changes.md
        } > notes.md
    - name: Write release notes
      if: needs.prepare.outputs.draft != 'true'
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        images="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${COMMIT}/black-arrow-online/docs/images"
        {
          echo "Build $LABEL of Black Arrow Online, based on xemu ${UPSTREAM#v} (source version $VERSION)."
          echo
          if [ "${SUB:-0}" != 0 ]; then
            echo "<!-- systems: $SYSTEMS -->"
            echo "A sub build for $(echo "$SYSTEMS" | sed 's/windows/Windows/; s/mac/Mac/; s/linux/Linux/; s/ /, /g') only. Other systems keep the files of ${PREV_TAG#build-} (build ${PREV_TAG#build-}) and are not offered anything."
            echo
          fi
          if [ -s meta/changes.md ]; then
            echo "### What changed"
            echo
            cat meta/changes.md
            echo
          fi
          echo "### How to get it"
          echo
          echo "**Already playing?** Start Black Arrow Online as usual. It finds this build and offers to install it. Your console, Xbox Live sign-in, saves, settings and games are not touched."
          echo
          echo "<img src=\"$images/launcher-update.png\" width=\"420\" alt=\"The update window\">"
          echo
          echo "To update by hand, close the emulator and unzip \`BlackArrowOnline-update.zip\` over your Black Arrow Online folder."
          echo
          echo "**New here?** Get the full package from where Black Arrow Online is shared. This download is an update for a package you already have: it has no Xbox BIOS, dashboard or game files and cannot set up a new console on its own. See the [README](https://github.com/${GITHUB_REPOSITORY}#readme)."
          echo
          echo "### Files"
          echo
          echo "| File | What it is |"
          echo "|---|---|"
          echo "| \`BlackArrowOnline-update.zip\` | The launcher, xemu.exe and the shader list |"
          echo "| \`version.txt\` | What the launcher reads to find this build |"
          echo "| \`BlackArrowOnline-source-$TAG.tar.zst\` | The complete source this build was made from |"
        } > notes.md
    - name: Keep the test build
      if: needs.prepare.outputs.publish != 'true' && needs.prepare.outputs.draft != 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: BlackArrowOnline-windows-test
        path: |
          BlackArrowOnline-update.zip
          version.txt
          notes.md
        compression-level: 0
    - name: Publish
      if: needs.prepare.outputs.publish == 'true'
      shell: bash
      run: |
        if ! out=$(gh release create "$TAG" --target "$COMMIT" --latest \
            --title "Build $LABEL (xemu ${UPSTREAM#v})" --notes-file notes.md \
            BlackArrowOnline-update.zip version.txt \
            "BlackArrowOnline-source-$TAG.tar.zst" 2>&1); then
          echo "::error::$(echo "$out" | tr '\n' ' ')"
          exit 1
        fi
        echo "$out"
    # A draft has no tag until it is published, and is never published: the
    # xemu release reaches players only through a hand merge pushed to main
    - name: Keep as a draft
      if: needs.prepare.outputs.draft == 'true'
      shell: bash
      run: |
        if ! out=$(gh release create "$TAG" --draft \
            --title "Test: xemu ${UPSTREAM#v} (not released)" --notes-file notes.md \
            BlackArrowOnline-update.zip version.txt \
            "BlackArrowOnline-source-$TAG.tar.zst" 2>&1); then
          echo "::error::$(echo "$out" | tr '\n' ' ')"
          exit 1
        fi
        echo "$out"

  # xemu's own Mac build steps (build-macos.yml), release only. Job logs need a
  # GitHub sign-in to read, so a failed build also reports its errors as
  # annotations, which anyone can read.
  mac:
    name: Build for Mac (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.release == 'true' && contains(needs.prepare.outputs.systems, 'mac')
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      CCACHE_DIR: ${{ github.workspace }}/xemu-ccache
      CCACHE_MAXSIZE: 512M
      LTO_CACHE_DIR: ${{ github.workspace }}/xemu-lto-cache
    steps:
    - name: Download source package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
      with:
        name: src
    - name: Extract source package
      run: tar -xf xemu-${{ needs.prepare.outputs.version }}.tar.zst --strip-components=2
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        brew install ccache coreutils dylibbundler
        pip install pyyaml requests
    - name: Initialize compiler, library cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
      with:
        path: |
          macos-pkgs
          ${{ env.CCACHE_DIR }}
          ${{ env.LTO_CACHE_DIR }}
        key: cache-bao-macos-${{ matrix.arch }}-${{ github.sha }}
        restore-keys: cache-bao-macos-${{ matrix.arch }}-
    - name: Setup ccache
      run: |
        echo "PATH=/opt/homebrew/opt/ccache/libexec:$PATH" >> "$GITHUB_ENV"
        mkdir -p "$CCACHE_DIR" "$LTO_CACHE_DIR"
    - name: Compile
      run: |
        # Not -e: the errors are reported below before failing
        set +e -uo pipefail
        # Keep going after a failed file (QEMU's Makefile passes -k0 to
        # ninja), so one run shows every file that does not build on Mac
        export MAKEFLAGS=k
        ./build.sh -a ${{ matrix.arch }} \
            -Db_lto=true -Db_lto_mode=thin -Db_thinlto_cache=true \
            -Db_thinlto_cache_dir="$LTO_CACHE_DIR" -Dx86_version=3 \
            2>&1 | tee full-build.log
        status=${PIPESTATUS[0]}
        if [ "$status" != 0 ]; then
          # Compiler and linker errors with the lines after them, then the
          # last lines of the log, in annotations of under 4096 characters
          # (GitHub's limit), at most 8
          { grep -E -A4 '(^FAILED: | error: |fatal error|^Undefined symbols|^ld: |^ERROR|^make: \*\*\*)' \
                full-build.log | grep -v ' warning: ' | head -n 120
            echo "----- last lines -----"
            tail -n 15 full-build.log
          } | cut -c 1-300 | sed 's/%/%25/g' | awk '
              { line = $0 "%0A" }
              length(chunk) + length(line) > 3900 { print chunk; chunk = "" }
              { chunk = chunk line }
              END { if (chunk != "") print chunk }' | head -n 8 |
          while IFS= read -r chunk; do
            echo "::error title=Mac build failed (${{ matrix.arch }})::$chunk"
          done
        fi
        exit "$status"
    - name: Package
      run: |
        cd dist
        zip -qry ../xemu-macos-${{ matrix.arch }}.zip *
    - name: Upload build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: xemu-macos-${{ matrix.arch }}
        path: xemu-macos-${{ matrix.arch }}.zip
        compression-level: 0

  mac-universal:
    name: Join the Mac builds into one app
    needs: mac
    runs-on: macos-15
    steps:
    - name: Download both builds
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
      with:
        pattern: xemu-macos-*
        merge-multiple: true
    - name: Join and sign
      run: |
        set -euo pipefail
        mkdir dist
        cd dist
        for arch in x86_64 arm64; do
          unzip -qo ../xemu-macos-${arch}.zip
          mv xemu.app/Contents/MacOS/xemu ../xemu_${arch}
        done
        lipo -create -output xemu.app/Contents/MacOS/xemu ../xemu_x86_64 ../xemu_arm64
        codesign --force --deep --preserve-metadata=entitlements,requirements,flags,runtime --sign - xemu.app/Contents/MacOS/xemu
        zip -qry ../xemu-macos-universal.zip *
    - name: Upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: xemu-macos-universal-release
        path: xemu-macos-universal.zip
        compression-level: 0

  mac-package:
    name: Package the Mac app
    needs: [prepare, mac-universal]
    runs-on: ubuntu-latest
    env:
      BUILD: ${{ needs.prepare.outputs.build }}
      SUB: ${{ needs.prepare.outputs.sub }}
      PUBLISH: ${{ needs.prepare.outputs.publish }}
      VERSION: ${{ needs.prepare.outputs.version }}
      UPSTREAM: ${{ needs.prepare.outputs.upstream }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
    - name: Clone the setup script and package files
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        ref: ${{ needs.prepare.outputs.commit }}
        sparse-checkout: |
          black-arrow-online/mac
          black-arrow-online/package
    - name: Download the Mac app
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
      with:
        name: xemu-macos-universal-release
        path: app
    - name: Download release notes
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
      with:
        name: meta
        path: meta
    - name: Package
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        # Same top folder as the Windows package, so the full package made
        # from this zip unzips to BlackArrowOnline/ with system/ beside the app
        pkg=BlackArrowOnline
        mkdir -p unpacked "$pkg"
        (cd unpacked && unzip -q ../app/*.zip)
        mv unpacked/xemu.app "$pkg/Black Arrow Online.app"
        cp black-arrow-online/mac/README.txt "$pkg/README.txt"
        install -m 755 black-arrow-online/mac/setup.sh "$pkg/setup.sh"
        cp black-arrow-online/package/shader-list.bin "$pkg/shader-list.bin"
        # A test build has no build number, so the app takes any build over it
        build=""
        if [ "$PUBLISH" = true ]; then
          build="$BUILD"
        fi
        notes=$(cat meta/notes.txt 2>/dev/null || true)
        printf 'build=%s\nxemu=%s\nversion=%s\ndate=%s\ncommit=%s\nupstream=%s\nnotes=%s\n' \
            "$build" "${UPSTREAM#v}" "$VERSION" "$(date -u +%Y-%m-%d)" "$COMMIT" "$UPSTREAM" "$notes" \
            > "$pkg/version.txt"
        if [ -n "$build" ] && [ "${SUB:-0}" != 0 ]; then
          echo "sub=$SUB" >> "$pkg/version.txt"
        fi
        ls -la "$pkg"
        # zip keeps the app's links and executable bits, which the artifact
        # zip around it would not
        zip -qry BlackArrowOnline-mac-update.zip "$pkg"
        cp "$pkg/version.txt" mac-version.txt
        echo "sha256=$(sha256sum BlackArrowOnline-mac-update.zip | cut -d' ' -f1)" >> mac-version.txt
        cat mac-version.txt
    - name: Upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: BlackArrowOnline-mac
        path: |
          BlackArrowOnline-mac-update.zip
          mac-version.txt
        compression-level: 0

  mac-publish:
    name: Add the Mac app to the release
    needs: [prepare, release, mac-package]
    # A sub build without the Mac copies the newest release's Mac files
    if: always() && needs.release.result == 'success' && (needs.mac-package.result == 'success' || !contains(needs.prepare.outputs.systems, 'mac')) && (needs.prepare.outputs.publish == 'true' || needs.prepare.outputs.draft == 'true')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Not the upstream remote, which gh would prefer
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PREV_TAG: ${{ needs.prepare.outputs.prev_tag }}
      COPIED: ${{ !contains(needs.prepare.outputs.systems, 'mac') }}
    steps:
    - name: Download the Mac app
      if: contains(needs.prepare.outputs.systems, 'mac')
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
      with:
        name: BlackArrowOnline-mac
    - name: Copy the Mac files of the build before
      if: "!contains(needs.prepare.outputs.systems, 'mac')"
      run: gh release download "$PREV_TAG" --pattern mac-version.txt --pattern BlackArrowOnline-mac-update.zip
    - name: Add the Mac section to the release notes
      if: needs.prepare.outputs.publish == 'true'
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        gh release view "$TAG" --json body --jq .body > notes.md
        {
          echo
          echo "### Mac"
          echo
          if [ "$COPIED" = true ]; then
            echo "Unchanged: the Mac files of build ${PREV_TAG#build-}, so Macs are not offered anything new."
            echo
          fi
          echo "For Apple Silicon Macs with macOS 14 or newer and Intel Macs with macOS 11 or newer."
          echo
          echo "**Already playing on a Mac?** Black Arrow Online offers this build by itself a few seconds after it starts: click **Update now**. It closes, installs the build and opens again. Your console, Xbox Live sign-in, saves, settings and games are not touched."
          echo
          echo "To update by hand, download \`BlackArrowOnline-mac-update.zip\`, unzip it in Downloads and paste the Terminal line from its README.txt."
          echo
          echo "**New on a Mac?** Get the full Mac package from where Black Arrow Online is shared. This download has no Xbox BIOS, dashboard or game files."
          echo
          echo "| File | What it is |"
          echo "|---|---|"
          echo "| \`BlackArrowOnline-mac-update.zip\` | The Mac app, its setup script and the shader list |"
          echo "| \`mac-version.txt\` | What the Mac app reads to find this build |"
        } >> notes.md
    - name: Publish
      run: |
        if ! out=$(gh release upload "$TAG" BlackArrowOnline-mac-update.zip \
            mac-version.txt 2>&1); then
          echo "::error::$(echo "$out" | tr '\n' ' ')"
          exit 1
        fi
        echo "$out"
        if [ -f notes.md ]; then
          gh release edit "$TAG" --notes-file notes.md
        fi

  # xemu's own Linux build steps (build-linux.yml), x86_64 release only. The
  # app is the AppDir linuxdeploy makes (the program with its libraries, run
  # by its AppRun), not an AppImage: an AppImage needs FUSE 2, which newer
  # systems no longer have.
  linux:
    name: Build for Linux
    needs: prepare
    if: needs.prepare.outputs.release == 'true' && contains(needs.prepare.outputs.systems, 'linux')
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: /tmp/xemu-ccache
      CCACHE_MAXSIZE: 512M
      LTO_CACHE_DIR: /tmp/xemu-lto-cache
      LTO_CACHE_MAXSIZE: 512m
      DEB_BUILD_MAINT_OPTIONS: optimize=-lto
      DEB_LDFLAGS_MAINT_APPEND: -Wl,--build-id=sha1
      CC: ccache clang-21
      CXX: ccache clang++-21
      CC_LD: lld-21
      CXX_LD: lld-21
      AR: llvm-ar-21
      RANLIB: llvm-ranlib-21
      NM: llvm-nm-21
    steps:
    - name: Initialize compiler cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
      with:
        path: |
          ${{ env.CCACHE_DIR }}
          ${{ env.LTO_CACHE_DIR }}
        key: cache-bao-linux-${{ github.sha }}
        restore-keys: cache-bao-linux-
    - name: Download source package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
      with:
        name: src
    - name: Extract source package
      run: |
        mkdir src
        tar -xf xemu-${{ needs.prepare.outputs.version }}.tar.zst -C src --strip-components=2
        printf 'xemu (1:0.0.0-0) unstable; urgency=medium\n\n  Built from %s\n\n -- Black Arrow Online <noreply@github.com>  %s\n' \
            "${{ needs.prepare.outputs.version }}" "$(date -R)" > src/debian/changelog
    - name: Install dependencies
      env:
        POOL: https://apt.llvm.org/jammy/pool/main/l/llvm-toolchain-21/
      run: |
        set -euxo pipefail
        sudo apt-get -qy update
        sudo apt-get install -qy ccache libusb-1.0-0-dev
        (cd src && sudo apt-get -qy build-dep .)
        # LLVM 21, as xemu's own Linux build: the newest version in the pool
        html="$(curl -fsSL --compressed "$POOL")"
        ver="$(grep -oE 'libllvm21_[0-9][^"]+_amd64\.deb' <<<"$html" | head -n1 |
               sed -E 's/^libllvm21_//; s/_amd64\.deb$//')"
        mkdir -p /tmp/llvm21 && cd /tmp/llvm21
        for pkg in clang-21 clang-tools-21 lld-21 libllvm21 libclang-cpp21 \
            libclang-common-21-dev libclang1-21 libclang-rt-21-dev llvm-21 \
            llvm-21-dev llvm-21-linker-tools llvm-21-runtime llvm-21-tools; do
          curl -fsSLO "${POOL}${pkg}_${ver}_amd64.deb"
        done
        sudo apt-get install -y --no-install-recommends ./*.deb
        echo "PATH=/usr/lib/ccache:$PATH" >> "$GITHUB_ENV"
    - name: Compile
      run: |
        # Not -e: the errors are reported below before failing
        set +e -uo pipefail
        mkdir -p "$CCACHE_DIR" "$LTO_CACHE_DIR"
        # dpkg-genbuildinfo takes minutes on GitHub runners
        sudo ln -sf /bin/true /usr/bin/dpkg-genbuildinfo
        export XEMU_BUILD_OPTIONS="--extra-ldflags=-Wl,--thinlto-cache-policy=cache_size_bytes=$LTO_CACHE_MAXSIZE -Db_lto=true -Db_lto_mode=thin -Db_thinlto_cache=true -Db_thinlto_cache_dir=$LTO_CACHE_DIR -Dx86_version=3"
        (cd src && dpkg-buildpackage --no-sign -b) 2>&1 | tee full-build.log
        status=${PIPESTATUS[0]}
        if [ "$status" != 0 ]; then
          grep -E -A4 '(^FAILED: | error: |fatal error|undefined reference)' full-build.log |
              head -n 40 | cut -c 1-300 | while IFS= read -r line; do
            echo "::error title=Linux build failed::$line"
          done
        fi
        exit "$status"
    - name: Make the app folder
      run: |
        set -euo pipefail
        wget --no-verbose https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage
        mkdir deb app
        (cd deb && ar x ../xemu_*.deb)
        tar -C app -xf deb/data.tar*
        # The host's GLib, as xemu's AppImage: libdecor's GTK plugin fails
        # against an older bundled one. libusb too: linuxdeploy leaves it to
        # the system, and not every system has it
        ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run --appdir app \
            --exclude-library 'libglib-2.0.so*' \
            --library /usr/lib/x86_64-linux-gnu/libusb-1.0.so.0
        ls -la app
        test -x app/AppRun
        test -f app/usr/lib/libusb-1.0.so.0
        tar -czf xemu-linux-app.tar.gz app
    - name: Upload build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: xemu-linux
        path: xemu-linux-app.tar.gz
        compression-level: 0

  linux-package:
    name: Package the Linux app
    needs: [prepare, linux]
    runs-on: ubuntu-latest
    env:
      BUILD: ${{ needs.prepare.outputs.build }}
      SUB: ${{ needs.prepare.outputs.sub }}
      PUBLISH: ${{ needs.prepare.outputs.publish }}
      VERSION: ${{ needs.prepare.outputs.version }}
      UPSTREAM: ${{ needs.prepare.outputs.upstream }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
    - name: Clone the setup script and package files
