      with:
        name: BlackArrowOnline-linux
    - name: Copy the Linux files of the build before
      if: "!contains(needs.prepare.outputs.systems, 'linux')"
      run: gh release download "$PREV_TAG" --pattern linux-version.txt --pattern BlackArrowOnline-linux-update.tar.gz
    - name: Add the Linux section to the release notes
      if: needs.prepare.outputs.publish == 'true'
      run: |
        set -euo pipefail
        trap 'echo "::error::line $LINENO: $BASH_COMMAND"' ERR
        gh release view "$TAG" --json body --jq .body > notes.md
        {
          echo
          echo "### Linux"
          echo
          if [ "$COPIED" = true ]; then
            echo "Unchanged: the Linux files of build ${PREV_TAG#build-}, so Linux players are not offered anything new."
            echo
          fi
          echo "For 64-bit PCs and the Steam Deck with a Linux from 2022 or later (Ubuntu 22.04, Fedora 36, SteamOS 3...)."
          echo
          echo "**Already playing on Linux?** Black Arrow Online offers this build by itself a few seconds after it starts: click **Update now**. It closes, installs the build and opens again. Your console, Xbox Live sign-in, saves, settings and games are not touched."
          echo
          echo "To update by hand, download \`BlackArrowOnline-linux-update.tar.gz\`, unpack it and run \`bash setup.sh\` in its folder."
          echo
          echo "**New on Linux?** Get the full Linux package from where Black Arrow Online is shared. This download has no Xbox BIOS, dashboard or game files."
          echo
          echo "| File | What it is |"
          echo "|---|---|"
          echo "| \`BlackArrowOnline-linux-update.tar.gz\` | The Linux app, its setup script and the shader list |"
          echo "| \`linux-version.txt\` | What the Linux app reads to find this build |"
        } >> notes.md
    - name: Publish
      run: |
        if ! out=$(gh release upload "$TAG" BlackArrowOnline-linux-update.tar.gz \
