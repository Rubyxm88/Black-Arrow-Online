    if: always() && needs.release.result == 'success' && (needs.linux-package.result == 'success' || !contains(needs.prepare.outputs.systems, 'linux')) && (needs.prepare.outputs.publish == 'true' || needs.prepare.outputs.draft == 'true')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Not the upstream remote, which gh would prefer
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PREV_TAG: ${{ needs.prepare.outputs.prev_tag }}
      COPIED: ${{ !contains(needs.prepare.outputs.systems, 'linux') }}
    steps:
    - name: Download the Linux app
      if: contains(needs.prepare.outputs.systems, 'linux')
