        pkg=BlackArrowOnline
        mkdir -p "$pkg"
        tar -xzf xemu-linux-app.tar.gz -C "$pkg"
        cp black-arrow-online/linux/README.txt "$pkg/README.txt"
        install -m 755 black-arrow-online/linux/setup.sh "$pkg/setup.sh"
        cp black-arrow-online/package/shader-list.bin "$pkg/shader-list.bin"
        # A test build has no build number, so the app takes any build over it
        build=""
        if [ "$PUBLISH" = true ]; then
          build="$BUILD"
        fi
        notes=$(cat meta/notes.txt 2>/dev/null || true)
        printf 'build=%s\nxemu=%s\nversion=%s\ndate=%s\ncommit=%s\nupstream=%s\nnotes=%s\n' \
            "$build" "${UPSTREAM#v}" "$VERSION" "$(date -u +%Y-%m-%d)" "$COMMIT" "$UPSTREAM" "$notes" \
            > "$pkg/version.txt"
        if [ -n "$build" ] && [ "${SUB:-0}" != 0 ]; then
          echo "sub=$SUB" >> "$pkg/version.txt"
        fi
        ls -la "$pkg"
        # tar keeps the app's links and executable bits, which the artifact
        # zip around it would not
        tar -czf BlackArrowOnline-linux-update.tar.gz "$pkg"
        cp "$pkg/version.txt" linux-version.txt
        echo "sha256=$(sha256sum BlackArrowOnline-linux-update.tar.gz | cut -d' ' -f1)" >> linux-version.txt
        cat linux-version.txt
    - name: Upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: BlackArrowOnline-linux
        path: |
          BlackArrowOnline-linux-update.tar.gz
          linux-version.txt
        compression-level: 0

  linux-publish:
    name: Add the Linux app to the release
    needs: [prepare, release, linux-package, mac-publish]
    # After the Mac app (or its failure), so the two never edit the notes at
    # once
